<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"
  role="img"
  aria-label="Flux de contribution pour le Design System Canopée allant de la demande au dépôt, à la documentation, aux validations puis à la pull request"
  data-visual-kind="diagram"
  data-visual-id="000-design-system-contribution-flow-dark">
  <rect width="1200" height="520" fill="#0d1117"/>
  <rect x="40" y="40" width="1120" height="440" rx="12" ry="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc">Flux de contribution : du besoin à la pull request</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">Le workflow doit lire le dépôt, vérifier la documentation, puis valider un changement localisé avant d’ouvrir une PR.</text>

  <rect x="70" y="170" width="175" height="180" rx="10" ry="10" fill="#1c2d41" stroke="#2f81f7" stroke-width="2" data-node="request"/>
  <rect x="70" y="170" width="175" height="36" rx="10" ry="10" fill="#2f81f7"/>
  <rect x="70" y="188" width="175" height="18" fill="#2f81f7"/>
  <text x="158" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Demande</text>
  <text x="158" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#79c0ff">Point d’entrée</text>
  <text x="158" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#79c0ff">bug, amélioration</text>
  <text x="158" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#79c0ff">ou demande documentaire</text>
  <text x="158" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#8b949e">Le besoin doit être clarifié avant édition</text>

  <line x1="245" y1="260" x2="287" y2="260" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD2)"/>
  <circle cx="266" cy="260" r="13" fill="#2f81f7"/>
  <text x="266" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>

  <rect x="287" y="130" width="210" height="120" rx="10" ry="10" fill="#1a2c1e" stroke="#3fb950" stroke-width="2" data-node="repository"/>
  <rect x="287" y="130" width="210" height="36" rx="10" ry="10" fill="#1a7f37"/>
  <rect x="287" y="148" width="210" height="18" fill="#1a7f37"/>
  <text x="392" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Dépôt GitHub</text>
  <text x="392" y="189" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#3fb950">Sources réelles</text>
  <text x="392" y="207" text-anchor="middle" font-family="monospace, sans-serif" font-size="11" fill="#3fb950">packages/, plugins/, historique</text>
  <text x="392" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3fb950">où la modification s’applique</text>

  <rect x="287" y="270" width="210" height="120" rx="10" ry="10" fill="#2f1f4f" stroke="#a371f7" stroke-width="2" data-node="documentation"/>
  <rect x="287" y="270" width="210" height="36" rx="10" ry="10" fill="#8957e5"/>
  <rect x="287" y="288" width="210" height="18" fill="#8957e5"/>
  <text x="392" y="293" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Documentation</text>
  <text x="392" y="329" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d2a8ff">Storybook et Zeroheight</text>
  <text x="392" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d2a8ff">variants, usages, conventions</text>
  <text x="392" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d2a8ff">à garder cohérents</text>

  <line x1="497" y1="200" x2="539" y2="200" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD2)"/>
  <line x1="497" y1="330" x2="539" y2="330" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD2)"/>
  <circle cx="518" cy="200" r="13" fill="#8957e5"/>
  <text x="518" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>

  <rect x="539" y="200" width="210" height="120" rx="10" ry="10" fill="#272216" stroke="#bf8700" stroke-width="2" data-node="agent-context"/>
  <rect x="539" y="200" width="210" height="36" rx="10" ry="10" fill="#bf8700"/>
  <rect x="539" y="218" width="210" height="18" fill="#bf8700"/>
  <text x="644" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Contexte agentique</text>
  <text x="644" y="259" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e3b341">Le workflow recoupe les</text>
  <text x="644" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e3b341">sources et cible la bonne surface</text>
  <text x="644" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e3b341">avant de proposer un changement</text>

  <line x1="749" y1="260" x2="791" y2="260" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD2)"/>
  <circle cx="770" cy="265" r="13" fill="#bf8700"/>
  <text x="770" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>

  <rect x="791" y="130" width="165" height="120" rx="10" ry="10" fill="#2f1f4f" stroke="#a371f7" stroke-width="2" data-node="validation"/>
  <rect x="791" y="130" width="165" height="36" rx="10" ry="10" fill="#8957e5"/>
  <rect x="791" y="148" width="165" height="18" fill="#8957e5"/>
  <text x="874" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Pair tests avec UX</text>
  <text x="874" y="189" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d2a8ff">Validation conjointe</text>
  <text x="874" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d2a8ff">rendu, usage et intention</text>
  <text x="874" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d2a8ff">avant ouverture de PR</text>

  <rect x="791" y="270" width="165" height="120" rx="10" ry="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2" data-node="pull-request"/>
  <rect x="791" y="270" width="165" height="36" rx="10" ry="10" fill="#2f81f7"/>
  <rect x="791" y="288" width="165" height="18" fill="#2f81f7"/>
  <text x="874" y="293" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Pull Request</text>
  <text x="874" y="329" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#79c0ff">Diff prêt à relire</text>
  <text x="874" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#79c0ff">impact expliqué et</text>
  <text x="874" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#79c0ff">surface de changement limitée</text>

  <line x1="956" y1="200" x2="1010" y2="200" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD2)"/>
  <line x1="956" y1="330" x2="1010" y2="330" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD2)"/>
  <circle cx="983" cy="265" r="13" fill="#f85149"/>
  <text x="983" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">4</text>

  <text x="1090" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Résultat attendu</text>
  <text x="1090" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">une contribution</text>
  <text x="1090" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">localisée, relisible,</text>
  <text x="1090" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">et cohérente avec le DS</text>

  <defs>
    <marker id="arrowD2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#30363d"/>
    </marker>
  </defs>
</svg>
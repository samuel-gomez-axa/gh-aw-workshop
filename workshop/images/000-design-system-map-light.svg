<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"
  role="img"
  aria-label="Carte du Design System Canopée montrant le noyau partagé, les trois univers et les sorties React, CSS et documentation"
  data-visual-kind="diagram"
  data-visual-id="000-design-system-map-light">
  <rect width="1200" height="620" fill="#f6f8fa"/>
  <rect x="40" y="40" width="1120" height="540" rx="12" ry="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#24292f">Canopée: Core, univers et surfaces de sortie</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#57606a">Le noyau partagé alimente plusieurs univers. Chaque univers se décline ensuite en code, styles et documentation.</text>

  <rect x="425" y="150" width="350" height="120" rx="10" ry="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2" data-node="core"/>
  <rect x="425" y="150" width="350" height="36" rx="10" ry="10" fill="#1a7f37"/>
  <rect x="425" y="168" width="350" height="18" fill="#1a7f37"/>
  <text x="600" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Canopée Core</text>
  <text x="600" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#116329">Fondations partagées</text>
  <text x="600" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#116329">Tokens, composants et conventions</text>
  <text x="600" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#116329">servant l’ensemble du Design System</text>

  <line x1="600" y1="270" x2="600" y2="315" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="315" x2="220" y2="315" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="315" x2="600" y2="315" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="315" x2="980" y2="315" stroke="#d0d7de" stroke-width="2"/>
  <line x1="220" y1="315" x2="220" y2="333" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="315" x2="600" y2="333" stroke="#d0d7de" stroke-width="2"/>
  <line x1="980" y1="315" x2="980" y2="333" stroke="#d0d7de" stroke-width="2"/>

  <rect x="80" y="333" width="280" height="132" rx="10" ry="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2" data-node="client-universe"/>
  <rect x="80" y="333" width="280" height="36" rx="10" ry="10" fill="#0969da"/>
  <rect x="80" y="351" width="280" height="18" fill="#0969da"/>
  <text x="220" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Univers Client</text>
  <text x="220" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0550ae">Ancien nom : Look &amp; Feel</text>
  <text x="220" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0550ae">B2C, espaces connectés</text>
  <text x="220" y="431" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0550ae">Composants plus sobres</text>

  <rect x="460" y="333" width="280" height="132" rx="10" ry="10" fill="#fff8c5" stroke="#bf8700" stroke-width="2" data-node="prospect-universe"/>
  <rect x="460" y="333" width="280" height="36" rx="10" ry="10" fill="#bf8700"/>
  <rect x="460" y="351" width="280" height="18" fill="#bf8700"/>
  <text x="600" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Univers Prospect</text>
  <text x="600" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7d4e00">Ancien nom : Apollo</text>
  <text x="600" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7d4e00">B2C, sites publics</text>
  <text x="600" y="431" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7d4e00">Rendus plus expressifs</text>

  <rect x="840" y="333" width="280" height="132" rx="10" ry="10" fill="#fbefff" stroke="#8250df" stroke-width="2" data-node="distributeur-universe"/>
  <rect x="840" y="333" width="280" height="36" rx="10" ry="10" fill="#8250df"/>
  <rect x="840" y="351" width="280" height="18" fill="#8250df"/>
  <text x="980" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Collab-Distrib</text>
  <text x="980" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6f42c1">Ancien nom : Slash</text>
  <text x="980" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6f42c1">B2B, outils internes</text>
  <text x="980" y="431" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6f42c1">Priorité à l’efficacité</text>

  <line x1="220" y1="465" x2="220" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="220" y1="478" x2="600" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="220" y1="478" x2="980" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="220" y1="478" x2="220" y2="492" stroke="#d0d7de" stroke-width="2"/>
  <line x1="220" y1="478" x2="600" y2="492" stroke="#d0d7de" stroke-width="2"/>
  <line x1="220" y1="478" x2="980" y2="492" stroke="#d0d7de" stroke-width="2"/>

  <line x1="600" y1="465" x2="600" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="478" x2="220" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="478" x2="980" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="478" x2="220" y2="492" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="478" x2="600" y2="492" stroke="#d0d7de" stroke-width="2"/>
  <line x1="600" y1="478" x2="980" y2="492" stroke="#d0d7de" stroke-width="2"/>

  <line x1="980" y1="465" x2="980" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="980" y1="478" x2="220" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="980" y1="478" x2="600" y2="478" stroke="#d0d7de" stroke-width="2"/>
  <line x1="980" y1="478" x2="220" y2="492" stroke="#d0d7de" stroke-width="2"/>
  <line x1="980" y1="478" x2="600" y2="492" stroke="#d0d7de" stroke-width="2"/>
  <line x1="980" y1="478" x2="980" y2="492" stroke="#d0d7de" stroke-width="2"/>

  <rect x="82" y="492" width="276" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" data-node="react-output"/>
  <text x="220" y="513" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#24292f">canopee-react</text>
  <text x="220" y="531" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">Composants React par univers</text>

  <rect x="462" y="492" width="276" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" data-node="css-output"/>
  <text x="600" y="513" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#24292f">canopee-css</text>
  <text x="600" y="531" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">Tokens, layers et fichiers CSS</text>

  <rect x="842" y="492" width="276" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" data-node="docs-output"/>
  <text x="980" y="513" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#24292f">Storybook + Zeroheight</text>
  <text x="980" y="531" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">Variantes observables et documentation</text>
</svg>
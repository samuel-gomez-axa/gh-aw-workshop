<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"
  role="img"
  aria-label="Carte du Design System Canopée montrant le noyau partagé, les trois univers et les sorties React, CSS et documentation"
  data-visual-kind="diagram"
  data-visual-id="000-design-system-map-dark">
  <rect width="1200" height="620" fill="#0d1117"/>
  <rect x="40" y="40" width="1120" height="540" rx="12" ry="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc">Canopée: Core, univers et surfaces de sortie</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">Le noyau partagé alimente plusieurs univers. Chaque univers se décline ensuite en code, styles et documentation.</text>

  <rect x="425" y="150" width="350" height="120" rx="10" ry="10" fill="#1a2c1e" stroke="#3fb950" stroke-width="2" data-node="core"/>
  <rect x="425" y="150" width="350" height="36" rx="10" ry="10" fill="#1a7f37"/>
  <rect x="425" y="168" width="350" height="18" fill="#1a7f37"/>
  <text x="600" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Canopée Core</text>
  <text x="600" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#3fb950">Fondations partagées</text>
  <text x="600" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#3fb950">Tokens, composants et conventions</text>
  <text x="600" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#3fb950">servant l’ensemble du Design System</text>

  <line x1="600" y1="270" x2="600" y2="315" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="315" x2="220" y2="315" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="315" x2="600" y2="315" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="315" x2="980" y2="315" stroke="#30363d" stroke-width="2"/>
  <line x1="220" y1="315" x2="220" y2="333" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="315" x2="600" y2="333" stroke="#30363d" stroke-width="2"/>
  <line x1="980" y1="315" x2="980" y2="333" stroke="#30363d" stroke-width="2"/>

  <rect x="80" y="333" width="280" height="132" rx="10" ry="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2" data-node="client-universe"/>
  <rect x="80" y="333" width="280" height="36" rx="10" ry="10" fill="#2f81f7"/>
  <rect x="80" y="351" width="280" height="18" fill="#2f81f7"/>
  <text x="220" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Univers Client</text>
  <text x="220" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#79c0ff">Ancien nom : Look &amp; Feel</text>
  <text x="220" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#79c0ff">B2C, espaces connectés</text>
  <text x="220" y="431" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#79c0ff">Composants plus sobres</text>

  <rect x="460" y="333" width="280" height="132" rx="10" ry="10" fill="#272216" stroke="#bf8700" stroke-width="2" data-node="prospect-universe"/>
  <rect x="460" y="333" width="280" height="36" rx="10" ry="10" fill="#bf8700"/>
  <rect x="460" y="351" width="280" height="18" fill="#bf8700"/>
  <text x="600" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Univers Prospect</text>
  <text x="600" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e3b341">Ancien nom : Apollo</text>
  <text x="600" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e3b341">B2C, sites publics</text>
  <text x="600" y="431" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e3b341">Rendus plus expressifs</text>

  <rect x="840" y="333" width="280" height="132" rx="10" ry="10" fill="#2f1f4f" stroke="#a371f7" stroke-width="2" data-node="distributeur-universe"/>
  <rect x="840" y="333" width="280" height="36" rx="10" ry="10" fill="#8957e5"/>
  <rect x="840" y="351" width="280" height="18" fill="#8957e5"/>
  <text x="980" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Collab-Distrib</text>
  <text x="980" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d2a8ff">Ancien nom : Slash</text>
  <text x="980" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d2a8ff">B2B, outils internes</text>
  <text x="980" y="431" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d2a8ff">Priorité à l’efficacité</text>

  <line x1="220" y1="465" x2="220" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="220" y1="478" x2="600" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="220" y1="478" x2="980" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="220" y1="478" x2="220" y2="492" stroke="#30363d" stroke-width="2"/>
  <line x1="220" y1="478" x2="600" y2="492" stroke="#30363d" stroke-width="2"/>
  <line x1="220" y1="478" x2="980" y2="492" stroke="#30363d" stroke-width="2"/>

  <line x1="600" y1="465" x2="600" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="478" x2="220" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="478" x2="980" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="478" x2="220" y2="492" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="478" x2="600" y2="492" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="478" x2="980" y2="492" stroke="#30363d" stroke-width="2"/>

  <line x1="980" y1="465" x2="980" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="980" y1="478" x2="220" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="980" y1="478" x2="600" y2="478" stroke="#30363d" stroke-width="2"/>
  <line x1="980" y1="478" x2="220" y2="492" stroke="#30363d" stroke-width="2"/>
  <line x1="980" y1="478" x2="600" y2="492" stroke="#30363d" stroke-width="2"/>
  <line x1="980" y1="478" x2="980" y2="492" stroke="#30363d" stroke-width="2"/>

  <rect x="82" y="492" width="276" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" data-node="react-output"/>
  <text x="220" y="513" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">canopee-react</text>
  <text x="220" y="531" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Composants React par univers</text>

  <rect x="462" y="492" width="276" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" data-node="css-output"/>
  <text x="600" y="513" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">canopee-css</text>
  <text x="600" y="531" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Tokens, layers et fichiers CSS</text>

  <rect x="842" y="492" width="276" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" data-node="docs-output"/>
  <text x="980" y="513" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Storybook + Zeroheight</text>
  <text x="980" y="531" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Variantes observables et documentation</text>
</svg>